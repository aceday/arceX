# ArceX nix defaults. Overrides the nix package's bare config.
# See https://nixos.org/manual/nix/stable/#sec-conf-file

# Unix group containing the Nix build user accounts (from sysusers.d/nix-daemon.conf)
build-users-group = nixbld

# Enable the modern CLI (nix profile install, nix develop, flake workflows)
experimental-features = nix-command flakes