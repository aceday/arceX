# mkinitcpio configuration for the arceX recovery initramfs.
#
# A minimal initramfs that boots systemd as PID 1 and applies a staged update
# from the root partition onto the read-only /usr partition (see
# /usr/lib/arcex/update-recovery.sh). It never mounts the running system's /
# or /usr, so no autodetect is used: the generic storage/filesystem modules
# below cover the ESP (vfat), the root partition (btrfs) and common disk
# controllers.

MODULES=()
BINARIES=()
FILES=()
HOOKS=(systemd microcode modconf block filesystems arcex-update)
COMPRESSION="zstd"

# Kernel modules for the storage/firmware drivers the update applies to.
MODULES+=(nvme ahci libahci xhci-pci ehci-pci usb-storage virtio_pci virtio_blk sd_mod)