[Distribution]
Distribution=arch

[Build]
ToolsTree=default
ToolsTreePackages=grub
WithNetwork=true
SandboxTrees=
    mkosi.sandbox:/
    /etc/pacman.d/cachyos-mirrorlist:/etc/pacman.d/cachyos-mirrorlist
    /etc/pacman.d/mirrorlist:/etc/pacman.d/mirrorlist
    /usr/share/pacman/keyrings:/usr/share/pacman/keyrings
    /etc/pacman.d/gnupg/trustdb.gpg:/etc/pacman.d/gnupg/trustdb.gpg

[Output]
OutputDirectory=mkosi.output
SplitArtifacts=uki,partitions
Format=disk
ImageId=arcex
ManifestFormat=json
Output=%i_%v_%a

[Content]
UnifiedKernelImages=unsigned
UnifiedKernelImageFormat=%i_%v_%a
KernelCommandLine=
    root=dissect
    mount.usr=dissect
    rw
    audit=0
Bootable=yes
Bootloader=grub
InitrdProfiles=
KernelInitrdModules=
    default
    erofs
Hostname=arcex

Packages=
    acl
    alsa-ucm-conf
    alsa-utils
    attr
    bash
    btrfs-progs
    bolt
    brightnessctl
    ca-certificates
    bluez
    bluez-utils
    coreutils
    cpio
    curl
    dbus-broker
    diffutils
    dmidecode
    dosfstools
    e2fsprogs
    efibootmgr
    erofs-utils
    erofsfuse
    exfatprogs
    file
    findutils
    fish
    fprintd
    gawk
    gdisk
    grep
    grub
    gzip
    intel-ucode
    i2c-tools
    iproute2
    iputils
    iw
    iwd
    intel-media-driver
    kbd
    kmod
    less
    libinput
    libva-utils
    linux-cachyos
    linux-firmware
    lm_sensors
    man-db
    mesa
    mkinitcpio
    mtools
    nano
    networkmanager
    nftables
    nix
    ntfs-3g
    nvme-cli
    openssl
    patch
    pciutils
    pipewire
    pipewire-pulse
    polkit
    power-profiles-daemon
    procps-ng
    python
    sed
    shadow
    smartmontools
    sof-firmware
    sudo
    systemd
    systemd-ukify
    tar
    udev
    udisks2
    unzip
    usbutils
    util-linux
    vulkan-icd-loader
    vulkan-intel
    wireplumber
    wpa_supplicant
    wireless-regdb
    xdg-user-dirs
    xdg-utils
    which
    zstd

RemovePackages=linux

InitrdPackages=
    btrfs-progs
    erofs-utils
    erofsfuse

VolatilePackages=
    systemd
    udev

InitrdVolatilePackages=
    systemd
    udev

[Runtime]
# RuntimeSize caps the shipped .raw apparent size. Partitions: ESP (512M),
# root (btrfs, takes the remainder), usr (erofs, last, squeezed to content
# via Minimize=yes) and trailing free space after usr that updates use to
# grow /usr in place. Keep the total a bit under the 16G SSD.
RuntimeSize=13G
RAM=4G
CPUs=4